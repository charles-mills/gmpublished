name: build

on:
  push:
    tags:
      - "*.*.*"

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: 0.11.8
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify release version
        run: packaging/scripts/verify_version.sh "$GITHUB_REF_NAME"

      - name: Require successful main-branch CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 2400))
          while [ "$SECONDS" -lt "$deadline" ]; do
            run="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow check.yml \
              --commit "$GITHUB_SHA" \
              --event push \
              --limit 1 \
              --json databaseId,status,conclusion \
              --jq '.[0] // empty | [.databaseId, .status, (.conclusion // "")] | @tsv')"

            if [ -z "$run" ]; then
              sleep 15
              continue
            fi

            IFS="$(printf '\t')" read -r run_id status conclusion <<< "$run"
            if [ "$status" != "completed" ]; then
              sleep 15
              continue
            fi

            if [ "$conclusion" = "success" ]; then
              printf 'verified by check run %s\n' "$run_id"
              exit 0
            fi

            printf 'check run %s completed with %s\n' "$run_id" "$conclusion" >&2
            exit 1
          done

          printf 'timed out waiting for CI on %s\n' "$GITHUB_SHA" >&2
          exit 1

  build_linux:
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libasound2-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            curl \
            desktop-file-utils \
            file \
            pkg-config \
            zip

      - name: Restore Cargo sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-sources-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-sources-${{ runner.os }}-

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Restore cargo-packager
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-packager*
          key: cargo-packager-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_PACKAGER_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Ensure cargo-packager
        run: >-
          cargo packager --version ||
          cargo install cargo-packager --locked --force --version "$CARGO_PACKAGER_VERSION"

      - name: Verify Steam runtime input
        run: test -f packaging/steam/redistributable/linux/libsteam_api.so

      - name: Verify lockfile matches manifests
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Package
        run: cargo packager --release --config packaging/Packager.linux.toml

      - name: Collect artifacts
        run: |
          artifact_version="${GITHUB_REF_NAME##*/}"
          artifact_version="${artifact_version#v}"

          appimage="$(find target/packager -type f -iname '*.AppImage' -print -quit)"
          deb="$(find target/packager -type f -iname '*.deb' -print -quit)"
          test -n "$appimage"
          test -n "$deb"

          root=artifacts/linux/zip-root
          mkdir -p "$root/share/applications" \
                   "$root/share/mime/packages" \
                   "$root/share/icons/hicolor/32x32/apps" \
                   "$root/share/icons/hicolor/128x128/apps" \
                   "$root/share/icons/hicolor/256x256/apps"

          cp target/release/gmpublished "$root/"
          cp target/release/libsteam_api.so "$root/"
          cp LICENSE THIRD-PARTY-NOTICES.md "$root/"
          cp packaging/linux/application-gma.xml "$root/share/mime/packages/"
          cp packaging/icons/32x32.png "$root/share/icons/hicolor/32x32/apps/gmpublished.png"
          cp packaging/icons/128x128.png "$root/share/icons/hicolor/128x128/apps/gmpublished.png"
          cp packaging/icons/128x128@2x.png "$root/share/icons/hicolor/256x256/apps/gmpublished.png"

          cp packaging/linux/gmpublished.desktop "$root/share/applications/"
          desktop-file-validate "$root/share/applications/gmpublished.desktop"
          diff "$root/share/applications/gmpublished.desktop" \
            <(dpkg-deb --fsys-tarfile "$deb" \
              | tar -xOf - ./usr/share/applications/gmpublished.desktop)

          (cd "$root" && zip -r "../gmpublished-${artifact_version}-x86_64-linux.zip" \
            gmpublished libsteam_api.so LICENSE THIRD-PARTY-NOTICES.md share)

          cp "$appimage" "artifacts/linux/gmpublished-${artifact_version}-x86_64-linux.AppImage"
          cp "$deb" "artifacts/linux/gmpublished-${artifact_version}-x86_64-linux.deb"

      - name: Attest release artifacts
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: artifacts/linux/gmpublished-*

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-linux
          path: artifacts/linux/gmpublished-*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  build_windows:
    needs: verify
    runs-on: windows-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore Cargo sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-sources-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-sources-${{ runner.os }}-

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Restore cargo-packager
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-packager*
          key: cargo-packager-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_PACKAGER_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Ensure cargo-packager
        shell: bash
        run: >-
          cargo packager --version ||
          cargo install cargo-packager --locked --force --version "$CARGO_PACKAGER_VERSION"

      - name: Verify Steam runtime input
        shell: bash
        run: test -f packaging/steam/redistributable/windows/steam_api64.dll

      - name: Verify lockfile matches manifests
        shell: bash
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Package
        shell: bash
        run: cargo packager --release --config packaging/Packager.windows.toml

      - name: Collect artifacts
        shell: bash
        run: |
          artifact_version="${GITHUB_REF_NAME##*/}"
          artifact_version="${artifact_version#v}"
          mkdir -p artifacts/windows
          msi="$(find target/packager -type f -iname '*.msi' -print -quit)"
          test -n "$msi"
          cp "$msi" "artifacts/windows/gmpublished-${artifact_version}-x86_64-windows.msi"

      - name: Attest release artifacts
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: artifacts/windows/gmpublished-*.msi

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-windows
          path: artifacts/windows/gmpublished-*.msi
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  build_macos:
    needs: verify
    runs-on: macos-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore Cargo sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-sources-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-sources-${{ runner.os }}-

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Restore cargo-packager
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-packager*
          key: cargo-packager-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_PACKAGER_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Ensure cargo-packager
        run: >-
          cargo packager --version ||
          cargo install cargo-packager --locked --force --version "$CARGO_PACKAGER_VERSION"

      - name: Install Apple Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Verify Steam runtime input
        run: test -f packaging/steam/redistributable/macos/libsteam_api.dylib

      - name: Verify lockfile matches manifests
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Build universal macOS executable
        run: packaging/scripts/stage_macos_universal_binary.sh

      - name: Package
        env:
          GMPUBLISHED_SKIP_PREPARE_BUILD: "1"
        run: cargo packager --release --config packaging/Packager.macos.toml --formats app

      - name: Fix app bundle metadata
        run: packaging/scripts/fix_macos_app_bundle.sh target/packager/gmpublished.app

      - name: Verify macOS universal app executable
        run: |
          app_executable="target/packager/gmpublished.app/Contents/MacOS/gmpublished"
          test -f "$app_executable"
          lipo -info "$app_executable"
          lipo "$app_executable" -verify_arch arm64
          lipo "$app_executable" -verify_arch x86_64

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE_P12 != '' && env.MACOS_CERTIFICATE_PASSWORD != '' && env.MACOS_SIGNING_IDENTITY != ''
        run: |
          security create-keychain -p "$RUNNER_TEMP" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$RUNNER_TEMP" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$RUNNER_TEMP" build.keychain

      - name: Sign app bundle
        if: env.MACOS_CERTIFICATE_P12 != '' && env.MACOS_CERTIFICATE_PASSWORD != '' && env.MACOS_SIGNING_IDENTITY != ''
        run: |
          codesign --force --deep --options runtime --sign "$MACOS_SIGNING_IDENTITY" target/packager/gmpublished.app
          codesign --verify --deep --strict --verbose=2 target/packager/gmpublished.app

      - name: Create disk image
        run: |
          artifact_version="${GITHUB_REF_NAME##*/}"
          artifact_version="${artifact_version#v}"
          packaging/scripts/create_macos_dmg.sh \
            target/packager/gmpublished.app \
            "artifacts/macos/gmpublished-${artifact_version}-universal-apple-darwin.dmg" \
            gmpublished

      - name: Notarize and staple
        if: env.MACOS_CERTIFICATE_P12 != '' && env.MACOS_CERTIFICATE_PASSWORD != '' && env.MACOS_SIGNING_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != ''
        run: |
          artifact_version="${GITHUB_REF_NAME##*/}"
          artifact_version="${artifact_version#v}"
          dmg="artifacts/macos/gmpublished-${artifact_version}-universal-apple-darwin.dmg"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler staple target/packager/gmpublished.app || true

      - name: Collect artifacts
        run: |
          artifact_version="${GITHUB_REF_NAME##*/}"
          artifact_version="${artifact_version#v}"
          ditto -c -k --keepParent \
            target/packager/gmpublished.app \
            "artifacts/macos/gmpublished-${artifact_version}-universal-apple-darwin.app.zip"

      - name: Attest release artifacts
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: artifacts/macos/gmpublished-*

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-macos
          path: artifacts/macos/gmpublished-*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    needs:
      - build_linux
      - build_windows
      - build_macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: artifacts/gmpublished-*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Refreshes AUR checksums against the published assets. Does not push to the AUR.
  aur_metadata:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:base-devel
    steps:
      # Without git, checkout falls back to a tarball and leaves nothing to commit from.
      - name: Install packaging tools
        run: pacman -Syu --noconfirm --needed git pacman-contrib desktop-file-utils namcap

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      # makepkg and updpkgsums refuse to run as root.
      - name: Refresh checksums and .SRCINFO
        run: |
          useradd -m builder
          chown -R builder:builder packaging/arch
          sudo -u builder packaging/scripts/update_aur_metadata.sh "${GITHUB_REF_NAME#v}"

      # Proves the published zip actually satisfies the PKGBUILD before its
      # checksums are committed. Without this nothing on the release path ever
      # builds the package the AUR will tell users to build.
      - name: Smoke-build the package
        working-directory: packaging/arch
        run: |
          chown -R builder:builder .
          sudo -u builder makepkg --nodeps --noconfirm --clean
          namcap PKGBUILD
          namcap ./*.pkg.tar.zst
          rm -rf ./*.pkg.tar.zst src pkg

      - name: Commit updated metadata
        working-directory: packaging/arch
        run: |
          git config --global --add safe.directory '*'

          # Scoped: updpkgsums leaves downloaded sources in this directory.
          git add PKGBUILD
          if [ -f .SRCINFO ]; then
            git add .SRCINFO
          fi
          if git diff --cached --quiet; then
            echo "checksums already current"
            exit 0
          fi

          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Update AUR package checksums for $GITHUB_REF_NAME"
          git push origin HEAD:main
