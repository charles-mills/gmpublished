[package]
name = "gmpublished-backend"
description = "Addon publishing and archive tools for gmpublished."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "gmpublished_backend"
path = "src/lib.rs"

[features]
test-support = []

[dependencies]
vformats.workspace = true
arc-swap.workspace = true
base64 = "0.13"
crc32fast.workspace = true
dirs.workspace = true
dunce = "1.0.5"
image = { workspace = true, features = ["gif", "tga", "bmp"] }
mdlc = { path = "../vendor/mdlc" }
log.workspace = true
lzma-rust2.workspace = true
nucleo-matcher.workspace = true
opener.workspace = true
parking_lot.workspace = true
rayon.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["std"] }
steamlocate.workspace = true
steamworks = { version = "0.13.1", features = ["serde"] }
tempfile.workspace = true
thiserror.workspace = true
trash.workspace = true
ureq.workspace = true
ufbx = "0.11"
walkdir.workspace = true

[dev-dependencies]
gmpublished-backend = { path = ".", features = ["test-support"] }
# The encoder feature is only needed to build LZMA-alone test fixtures.
lzma-rust2 = { workspace = true, features = ["encoder"] }

[lints]
workspace = true
