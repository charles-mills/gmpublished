[package]
name = "gmpublished-backend"
description = "Upstream-aligned backend for gmpublished."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "gmpublished_backend"
path = "src/lib.rs"

[features]
# Gates `scene` (BSP map preview decoding) and its tests. Carries no optional
# dependency of its own: the BSP path runs on `vformats`, which is always
# available.
scene = []

# Surface that exists only for tests to reach: probes that observe state no
# real operation needs (the `GmaView` spill-file pair), constructors for
# states production never builds (`SteamRuntime::unavailable_for_tests`,
# `TransactionId::from_raw`, the `MapWalkCollision` box builders), and
# `events::BackendEventCollector`. Off by default so a reader of the public
# API cannot mistake them for real operations; the self dev-dependency below
# turns it on for this crate's own integration tests, and the app crate's
# dev-dependencies turn it on for theirs.
test-support = []

[dependencies]
vformats.workspace = true
arc-swap.workspace = true
# `math::Vec3` is `repr(transparent)` + `Pod` so it crosses the wgpu and
# steamworks boundaries as the bare `[f32; 3]` it wraps.
bytemuck.workspace = true
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
crc32fast.workspace = true
dirs.workspace = true
dunce = "1.0.5"
image = { workspace = true, features = ["gif"] }
log.workspace = true
lzma-rust2.workspace = true
nucleo-matcher.workspace = true
opener.workspace = true
parking_lot.workspace = true
rayon.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["std"] }
steamlocate.workspace = true
steamworks = { version = "0.13.1", features = ["serde"] }
tempfile.workspace = true
thiserror.workspace = true
trash.workspace = true
ureq.workspace = true
walkdir.workspace = true

[dev-dependencies]
# Also enables `scene`, without which `cargo test -p gmpublished-backend`
# silently skips the entire BSP and particle decode suite — 96 tests that
# compile only when the feature is on.
gmpublished-backend = { path = ".", features = ["test-support", "scene"] }
# The encoder feature is only needed to build LZMA-alone test fixtures.
lzma-rust2 = { workspace = true, features = ["encoder"] }
steamworks-sys = "0.13.0"
tempfile.workspace = true

[lints]
workspace = true
