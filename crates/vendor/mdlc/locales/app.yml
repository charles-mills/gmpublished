"The material table has %{count} entries, over the format limit of %{max} (indices 0..%{last}) -- the skin table `pSkinref` is a **signed short**":
  zh-CN: "材质表有 %{count} 项，超出格式上限 %{max}（下标 0..%{last}）—— skin 表 `pSkinref` 是 **signed short**"

"The mesh %{model} has %{count} vertices, over the VTX per-mesh limit of %{max}\n`origMeshVertID` in VTX is `uint16`, which can express indices 0..=65535, so **a mesh can have at most 65536 vertices**.\nNote the granularity is **mesh (= one material)**, not the whole model.\n\nYou should not normally see this: the compiler automatically splits an oversized mesh into several meshes of the same material by triangles (TOML's `[model] split_oversized_meshes`, **default true**).\nSeeing it means that option was explicitly turned off; set it back to `true`.\nYou can also split by material (give several `$cdmaterials`/several textures in the QC, or several `$bodygroup` submodels), **no need to split the SMD file by hand**.":
  zh-CN: "mesh %{model} 有 %{count} 个顶点，超出 VTX 单 mesh 上限 %{max}\nVTX 的 `origMeshVertID` 是 `uint16`，能表达 0..=65535，所以**一个 mesh 最多 65536 个顶点**。\n注意粒度是**mesh（= 一个材质）**，不是整个 model。\n\n通常不该看到它：编译器会按三角形把超限的 mesh 自动拆成同材质的多个 mesh（TOML 的 `[model] split_oversized_meshes`，**默认 true**）。\n看到它说明那个选项被显式关掉了；把它设回 `true`。\n也可以按材质拆（在 QC 里给多个 `$cdmaterials`／多个纹理，或给多个 `$bodygroup` 子模型），**不必手工切分 SMD 文件**。"

"The mesh %{model} has %{count} vertices, over the format limit of %{max} (`origMeshVertID` in VTX is uint16, indices 0..%{last}) -- please split that mesh into several material slots":
  zh-CN: "mesh %{model} 有 %{count} 个顶点，超出格式上限 %{max}（VTX 的 `origMeshVertID` 是 uint16，下标 0..%{last}）—— 请把该 mesh 拆成多个材质槽"

"The parent bone %{bone} comes after this bone; parents must come first":
  zh-CN: "父骨骼 %{bone} 排在本骨骼之后；父骨骼必须先出现"

"The path %{path} has %{count} vertices (deduplicated across LODs), over the format limit of %{max} (`mstudiomodel_t.vertexindex` is an int32 byte offset, %{stride} bytes per vertex) -- please split that model into several `[[bodyparts.models]]`":
  zh-CN: "%{path} 有 %{count} 个顶点（跨 LOD 去重后），超出格式上限 %{max}（`mstudiomodel_t.vertexindex` 是 int32 字节偏移，每顶点 %{stride} 字节）—— 请把该 model 拆成多个 `[[bodyparts.models]]`"

"The path %{path} is too long: %{len} bytes, limit %{max}":
  zh-CN: "%{path} 过长：%{len} 字节，上限 %{max}"

"The tag in the Location header does not look like a version: %{tag}":
  zh-CN: "Location 里的 tag 不像版本号：%{tag}"

"The triangle index count %{count} of %{model} overflows int32":
  zh-CN: "%{model} 的三角形索引数 %{count} 超出 int32"

"The version should be %{expected} but is %{found}":
