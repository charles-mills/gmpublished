  zh-CN: "$defaultweightlist 尚未支持 —— 它会覆盖**所有**未显式指定 weightlist 的序列的权重，静默忽略会产出看起来对但语义错的模型。语料里该命令出现 0 次（$weightlist 出现 9 次）。若你的 QC 用到它，请改用 `$weightlist \"<name>\"` 并在序列上显式引用。"

