"A strip of %{model} uses %{count} bones, over the VTX per-strip limit of %{max}\n`Vertex_t.boneID[]` in VTX is a **signed char** (`optimize.h:51`); hardware slot indices >=128 are read as negative by the engine ==> vertices are skinned to the wrong bones.\n\nThis is a **format** limit, not a choice of this implementation, and you should not normally see it: the writer splits a mesh whose palette is over the limit into **several strips** following the official semantics (each <= `maxBonesPerStrip` = 53 bones, see [`plan_strips`]).\nSeeing it means the mesh has **out-of-range triangle indices** (the input is already broken) -- in that case the writer falls back to \"the whole group as one strip\", so all the bones of the group are squeezed into one strip. Fix the out-of-range vertex indices in the SMD first.":
  zh-CN: "%{model} 的一个 strip 用了 %{count} 根骨骼，超出 VTX 单 strip 上限 %{max}\n`Vertex_t.boneID[]` 是 **signed char**（`optimize.h:51`），硬件槽位下标 ≥128 会被引擎读成负数 ==> 顶点蒙皮到错误骨骼。\n\n这是**格式**上限，不是本实现的选择，通常不该看到它：写出器会按官方语义把调色板超限的 mesh 拆成**多条 strip**（每条 ≤ `maxBonesPerStrip` = 53 根，见 [`plan_strips`]）。\n看到它说明该 mesh 的**三角形下标越界**（输入本身已坏）—— 此时写出器退化成「整组当一条 strip」，于是该组所有骨骼挤进一条 strip。请先修掉 SMD 里越界的顶点下标。"

