_version: 2

"Source engine model compiler (a studiomdl rewrite)":
  zh-CN: "Source 引擎模型编译器（studiomdl 重写）"

"Compiles a TOML description or a QC script into the Source engine `.mdl` / `.vvd` / `.vtx` / `.phy` set, plus a few read-only inspection and conversion subcommands.":
  zh-CN: "把 TOML 描述或 QC 脚本编译成 Source 引擎的 `.mdl` / `.vvd` / `.vtx` / `.phy` 四件套，另带若干只读的检查与转换子命令。"

"It also works as the official `studiomdl`: `mdlc -game <gamedir> <model.qc>` writes the output under `<gamedir>\\models\\<$modelname>`, so it can be dropped in as Crowbar's compiler path.":
  zh-CN: "也能当官方 `studiomdl` 用：`mdlc -game <gamedir> <model.qc>` 会把产物写到 `<gamedir>\\models\\<$modelname>`，可直接替换 Crowbar 的编译器路径。"

"TOML description → .mdl/.vvd/.vtx (main path)":
  zh-CN: "TOML 描述 → .mdl/.vvd/.vtx（MVP 主线）"

"Validate a description file without writing anything":
  zh-CN: "只校验描述文件，不写文件"

"SMD triangles → convex hulls → .phy collision file":
  zh-CN: "SMD 三角形 → 凸包 → .phy 碰撞文件"

"QC script → TOML description (text only, no compile)":
  zh-CN: "QC 脚本 → TOML 描述（只写文本，不编译）"

"Compile straight from a QC script":
  zh-CN: "直接从 QC 编译"

"Parse a VVD and print its header and statistics":
  zh-CN: "解析并打印 VVD 头部与统计"

"Read a VVD and write it back, comparing byte for byte":
  zh-CN: "VVD 读入再写出，逐字节比对"

"Print a minimal, commented TOML template":
  zh-CN: "打印一份带注释的最小 TOML 模板"

"(internal) run one update check and write the cache":
  zh-CN: "（内部）跑一次更新检测并写缓存"

"Print this message or the help of the given subcommand(s)":
  zh-CN: "打印本信息或给定子命令的帮助"

"TOML description to compile":
  zh-CN: "要编译的 TOML 描述文件"

"TOML description to validate":
  zh-CN: "要校验的 TOML 描述文件"

"QC script to convert":
  zh-CN: "要转换的 QC 脚本"

"QC script to compile":
  zh-CN: "要编译的 QC 脚本"

"VVD file to parse and print the header and statistics of":
  zh-CN: "要解析并打印头部与统计的 VVD 文件"

"VVD file to round-trip":
  zh-CN: "要往返比对的 VVD 文件"

"Root output directory (defaults to the current directory)":
  zh-CN: "输出根目录（默认当前目录）"

"Output TOML path (defaults to the QC's own directory and name, with a .toml extension)":
  zh-CN: "输出的 TOML 路径（缺省与 QC 同目录同名，扩展名换成 .toml）"

"mdlc extension: enable the VTX cache optimization":
  zh-CN: "mdlc 扩展：打开 VTX 缓存优化"

"Input SMD (triangle vertices are already in model-local coordinates; no transform is applied, matching studiomdl)":
  zh-CN: "输入 SMD（三角形顶点已在模型局部坐标，不做任何变换，与 studiomdl 一致）"

"Output .phy path":
  zh-CN: "输出 .phy 路径"

"Checksum of the paired .mdl (decimal or 0x hex), default 0":
  zh-CN: "配对 .mdl 的 checksum（十进制或 0x 十六进制），默认 0"

"$mass equivalent total mass, default 1 (the official default; automatic mass via [physics].auto_mass is not supported)":
  zh-CN: "$mass 等效总质量，默认 1（官方缺省；[physics].auto_mass 的自动质量不支持）"

"Surface material, default default":
  zh-CN: "表面材质，默认 default"

"$concave: split into convex pieces by connected component (the official semantics, not a VHACD decomposition)":
  zh-CN: "$concave：按连通分量拆成多个凸块（官方语义，不是 VHACD 体分解）"

"VHACD approximate convex decomposition. Non-official semantics: concavities are preserved, whereas the official $concave fills them in":
  zh-CN: "VHACD 近似凸分解。非官方语义：保留凹口，而官方 $concave 是填平"

"$collisionjoints: group by skin-weight bone, one solid per bone":
  zh-CN: "$collisionjoints：按蒙皮权重骨骼分组，每个骨骼一个 solid"

