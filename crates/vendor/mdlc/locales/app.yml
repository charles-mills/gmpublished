"The vertex stride of MDL version %{mdl_version} is 64 bytes; this implementation only supports 48":
  zh-CN: "MDL 版本 %{mdl_version} 的顶点 stride 是 64 字节，本实现只支持 48"

"[physics.constraints] has %{count} entries, but this is the single-solid prop form (`joints = false`) -- `$jointconstrain` only makes sense for a ragdoll. Either remove it or set `joints` to true":
  zh-CN: "[physics.constraints] 有 %{count} 项，但这是单 solid 的 prop 形态（`joints = false`）—— `$jointconstrain` 只对 ragdoll 有意义。要么去掉它，要么把 `joints` 设为 true"

"[physics.joint_overrides] has %{count} entries, but this is the single-solid prop form (`joints = false`) -- per-joint parameters only make sense for a ragdoll. Either remove it or set `joints` to true":
  zh-CN: "[physics.joint_overrides] 有 %{count} 项，但这是单 solid 的 prop 形态（`joints = false`）—— 逐 joint 参数只对 ragdoll 有意义。要么去掉它，要么把 `joints` 设为 true"

"[physics.no_self_collisions] / [physics.collision_pairs] only make sense for a ragdoll (with `joints = false` there is no \"do the multiple solids collide\" question). Either remove it or set `joints` to true":
  zh-CN: "[physics.no_self_collisions] / [physics.collision_pairs] 只对 ragdoll 有意义（`joints = false` 时没有「多个 solid 之间碰不碰」的问题）。要么去掉它，要么把 `joints` 设为 true"

"`[physics].auto_mass` (`$automass`) needs the material density table (`scripts/surfaceproperties_manifest.txt`) to compute the total mass, and mdlc does not have that table. Please write `mass = <value>` explicitly":
  zh-CN: "`[physics].auto_mass`（`$automass`）需要材质密度表（`scripts/surfaceproperties_manifest.txt`）才能算出总质量，mdlc 没有该表。请显式写 `mass = <值>`"

