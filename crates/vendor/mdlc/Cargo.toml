[workspace]

[package]
name = "mdlc"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "Source 引擎模型编译器 —— studiomdl.exe 的 Rust 重写（MDL/VVD/VTX/PHY）"
license = "GPL-3.0-only"
repository = "https://github.com/charles-mills/mdlc"
publish = false
keywords = ["source-engine", "studiomdl", "mdl", "vvd", "vtx"]
categories = ["command-line-utilities", "game-development", "parser-implementations"]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "string"] }
clap-i18n-richformatter = "0.3.2"
indexmap = { version = "2.14.2", features = ["serde"] }
rust-i18n = "4.2.2"
sys-locale = "0.3.2"
log = "0.4.34"
meshopt = "0.6.2"
parry3d = "0.31.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
thiserror = "2.0.21"
hotpath = "0.26.1"
rustc-hash = "2.1.3"
ufbx = "0.11"
gltf = { version = "1.4", default-features = false, features = [
    "utils",
    "names",
    "extras",
    "extensions",
    "KHR_texture_transform",
] }
base64 = "0.13"
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
vformats = "=0.1.0"

[features]
hotpath = ["hotpath/hotpath"]

[profile.release]
lto = "thin"
codegen-units = 1

[package.metadata.vendor]
upstream = "https://github.com/MoRanYue/mdlc"
revision = "7d69fed846ce1057341d1c4b97be07f44bc683a1"
